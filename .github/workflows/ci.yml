name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, perf/tests-production-v31]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (legacy debt report)
        continue-on-error: true
        run: npm run lint

      - name: Test critical rules
        run: npm run test:ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key

      - name: Enforce frontend performance budget
        run: npm run check:bundle

      - name: Production dependency audit (high report)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Block critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=critical
